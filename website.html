<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QiuYuyue · Log</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script','noscript','style','textarea','pre','code']
      }
    };
  </script>

  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --cardBorder: rgba(15,23,42,.10);
      --text: #0f172a;
      --muted: rgba(15,23,42,.70);
      --muted2: rgba(15,23,42,.55);

      --link: #2563eb;
      --accent: #1d4ed8;
      --accentBg: rgba(29,78,216,.12);

      --codeBg: rgba(148,163,184,.22);
      --preBg: rgba(148,163,184,.16);
      --shadow: 0 10px 25px rgba(2,6,23,.10);
      --radius: 16px;

      --wrapMax: 1380px;

      /* 浮动目录尺寸 */
      --tocWidth: 290px;
      --tocRight: 24px;
      --tocTop: 112px;

      /* 主体右侧预留给目录的空间 */
      --mainRightGap: 330px;
    }

    html[data-theme="dark"]{
      --bg: #0b0f14;
      --card: rgba(255,255,255,.06);
      --cardBorder: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --muted2: rgba(255,255,255,.45);

      --link: #7aa2f7;
      --accent: #5b8cff;
      --accentBg: rgba(91,140,255,.14);

      --codeBg: rgba(255,255,255,.08);
      --preBg: rgba(255,255,255,.07);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    html,body{ height:100%; }

    body{
      margin: 0;
      background:
        radial-gradient(
          1200px 800px at 50% -20%,
          rgba(255,255,255,0.04),
          transparent 60%
        ),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    a{ color: var(--link); text-decoration: none; }
    a:hover{ text-decoration: underline; }

    .wrap{
      max-width: var(--wrapMax);
      margin: 0 auto;
      padding: 18px 20px 60px;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(10px);
      padding: 14px 0 10px;
    }
    html:not([data-theme="dark"]) .topbar{
      background: linear-gradient(to bottom, rgba(255,255,255,.82), rgba(255,255,255,0));
    }
    html[data-theme="dark"] .topbar{
      background: linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0));
    }

    .header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap: 6px;
    }

    .brand h1{
      margin:0;
      font-size: 22px;
      font-weight: 780;
      letter-spacing: .3px;
    }

    .brand .sub{
      margin:0;
      color: var(--muted);
      font-size: 13.5px;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }

    .btn{
      border: 1px solid var(--cardBorder);
      background: var(--card);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor:pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,.10);
      transition: transform .12s ease, box-shadow .12s ease;
      user-select:none;
    }

    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0,0,0,.14);
      text-decoration: none;
    }

    .searchRow{
      margin-top: 14px;
      display:flex;
      gap: 10px;
      align-items:center;
    }

    .search{
      flex:1;
      border: 1px solid var(--cardBorder);
      background: var(--card);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      outline:none;
      box-shadow: var(--shadow);
      font-size: 14px;
    }

    .hint{
      color: var(--muted2);
      font-size: 12.5px;
      white-space: nowrap;
    }

    /* 主列：给右侧浮板让出位置 */
    .mainWrap{
      padding-right: var(--mainRightGap);
      margin-top: 18px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap: 16px;
    }

    .post{
      border: 1px solid var(--cardBorder);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      scroll-margin-top: 108px;
    }

    .postHead{
      padding: 18px 18px 12px;
      border-bottom: 1px solid rgba(15,23,42,.08);
    }
    html[data-theme="dark"] .postHead{
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .title{
      margin:0;
      font-size: 19px;
      font-weight: 760;
      line-height: 1.35;
      color: var(--text);
    }

    .title a{
      color: inherit;
      text-decoration: none;
    }

    .meta{
      margin-top: 8px;
      color: var(--muted);
      font-size: 12.5px;
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--cardBorder);
      background: rgba(15,23,42,.03);
      color: var(--muted);
    }
    html[data-theme="dark"] .pill{
      background: rgba(255,255,255,.04);
    }

    .content{
      padding: 14px 18px 18px;
      font-size: 15px;
      line-height: 1.8;
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4{
      position: relative;
      scroll-margin-top: 108px;
    }

    .content h2{
      margin: 22px 0 12px;
      line-height: 1.35;
      font-size: 21px;
    }

    .content h3{
      margin: 18px 0 10px;
      line-height: 1.4;
      font-size: 17px;
    }

    .content p{ margin: 10px 0; }

    .content ul, .content ol{
      margin: 10px 0 10px 1.3em;
      padding: 0;
    }

    .content li{ margin: 6px 0; }

    .content img{
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--cardBorder);
      margin: 12px 0;
    }

    .content hr{
      border:none;
      height:1px;
      background: rgba(15,23,42,.10);
      margin: 18px 0;
    }
    html[data-theme="dark"] .content hr{
      background: rgba(255,255,255,.12);
    }

    .content blockquote{
      margin: 12px 0;
      padding: 10px 12px;
      border-left: 4px solid var(--accent);
      background: var(--accentBg);
      border-radius: 12px;
      color: var(--text);
    }

    .content code{
      background: var(--codeBg);
      padding: .15em .45em;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.92em;
    }

    .content pre{
      background: var(--preBg);
      border: 1px solid var(--cardBorder);
      padding: 14px;
      border-radius: 14px;
      overflow:auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    .content pre code{
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 13.5px;
    }

    .content table{
      width:100%;
      border-collapse: collapse;
      border-radius: 12px;
      border: 1px solid var(--cardBorder);
      margin: 12px 0;
      display: block;
      overflow-x: auto;
    }

    .content th,.content td{
      padding: 10px 12px;
      border-bottom: 1px solid rgba(15,23,42,.08);
      font-size: 13.5px;
      white-space: nowrap;
    }

    html[data-theme="dark"] .content th,
    html[data-theme="dark"] .content td{
      border-bottom: 1px solid rgba(255,255,255,.10);
    }

    .content th{
      text-align:left;
      color: var(--muted);
      background: rgba(15,23,42,.04);
    }

    html[data-theme="dark"] .content th{
      background: rgba(255,255,255,.04);
    }

    .anchor{
      opacity: 0;
      margin-left: 8px;
      font-size: .85em;
      color: var(--muted2);
      transition: opacity .12s ease;
      vertical-align: middle;
    }

    .content h2:hover .anchor,
    .content h3:hover .anchor{
      opacity: 1;
      text-decoration: none;
    }

    .status{
      margin: 10px 0 0;
      border: 1px dashed var(--cardBorder);
      background: rgba(15,23,42,.03);
      border-radius: 14px;
      padding: 18px;
      color: var(--muted);
      text-align:center;
    }
    html[data-theme="dark"] .status{
      background: rgba(255,255,255,.04);
    }

    /* ===== 浮动目录 ===== */
    .floatingToc{
      position: fixed;
      right: var(--tocRight);
      top: var(--tocTop);
      width: var(--tocWidth);
      max-height: calc(100vh - var(--tocTop) - 20px);
      border: 1px solid var(--cardBorder);
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      overflow: hidden;
      z-index: 15;
    }

    .tocTitle{
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 760;
      color: var(--text);
    }

    .tocDesc{
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .toc{
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: auto;
      max-height: calc(100vh - var(--tocTop) - 96px);
      padding-right: 4px;
      scroll-behavior: smooth;
    }

    .tocItem{
      display: block;
      padding: 7px 10px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      transition: background .12s ease, color .12s ease;
      word-break: break-word;
    }

    .tocItem:hover{
      background: rgba(15,23,42,.05);
      color: var(--text);
      text-decoration: none;
    }

    html[data-theme="dark"] .tocItem:hover{
      background: rgba(255,255,255,.06);
    }

    .tocItem.level-post{
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
    }

    .tocItem.level-h2{
      padding-left: 16px;
    }

    .tocItem.level-h3{
      padding-left: 28px;
      font-size: 12.5px;
    }

    .tocItem.active{
      background: var(--accentBg);
      color: var(--accent);
      font-weight: 700;
    }

    .tocEmpty{
      color: var(--muted2);
      font-size: 13px;
      line-height: 1.6;
      padding: 4px 2px;
    }

    .tocToggle{
      display: none;
    }

    footer{
      margin-top: 28px;
      color: var(--muted2);
      font-size: 12.5px;
      text-align:center;
    }

    /* 中等屏幕：缩小目录 */
    @media (max-width: 1200px){
      :root{
        --tocWidth: 250px;
        --mainRightGap: 285px;
        --tocRight: 16px;
      }
    }

    /* 窄屏：取消右侧浮板，改为顶部折叠块 */
    @media (max-width: 900px){
      :root{
        --mainRightGap: 0px;
      }

      .mainWrap{
        padding-right: 0;
      }

      .floatingToc{
        position: static;
        width: auto;
        max-height: none;
        margin: 18px 0 0;
      }

      .toc{
        max-height: 260px;
      }
    }

    @media (max-width: 640px){
      .wrap{
        padding: 14px 14px 48px;
      }

      .header{
        align-items: flex-start;
        flex-direction: column;
      }

      .actions{
        width: 100%;
        justify-content: flex-start;
      }

      .searchRow{
        flex-direction: column;
        align-items: stretch;
      }

      .hint{
        white-space: normal;
      }

      .content{
        font-size: 14.5px;
      }

      .title{
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <h1>QiuYuyue · Log</h1>
          <p class="sub">我们一起用2年的时间，看看我们会走向哪里</p>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn">🔄 刷新</button>
          <button class="btn" id="themeToggle" aria-label="切换深浅色" title="切换深浅色">🌙</button>
          <a class="btn" id="githubBtn" href="#" target="_blank" rel="noreferrer">↗ GitHub</a>
        </div>
      </div>

      <div class="searchRow">
        <input class="search" id="searchInput" placeholder="搜索标题或正文（本地过滤，不会请求 GitHub）" />
        <div class="hint" id="countHint">—</div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <aside class="floatingToc">
      <h2 class="tocTitle">目录</h2>
      <p class="tocDesc">自动提取文章标题和正文中的二、三级标题。</p>
      <nav id="toc" class="toc">
        <div class="tocEmpty">加载后这里会显示结构化目录。</div>
      </nav>
    </aside>

    <main class="mainWrap">
      <div id="app" class="status">加载中…</div>
      <footer>© <span id="year"></span> · Hosted on GitHub Pages</footer>
    </main>
  </div>

  <script>
    const user = 'qiuyuyue2022';
    const repo = 'ME';

    marked.setOptions({ gfm: true, breaks: false });

    const app = document.getElementById('app');
    const toc = document.getElementById('toc');
    const searchInput = document.getElementById('searchInput');
    const countHint = document.getElementById('countHint');
    const refreshBtn = document.getElementById('refreshBtn');
    const githubBtn = document.getElementById('githubBtn');
    const themeToggle = document.getElementById('themeToggle');

    document.getElementById('year').textContent = new Date().getFullYear();
    githubBtn.href = `https://github.com/${user}/${repo}/issues`;

    let allIssues = [];
    let headingObserver = null;

    function fmtDate(iso){
      const d = new Date(iso);
      return d.toLocaleDateString('zh-CN', {
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      });
    }

    function escapeHtml(str){
      return (str || '').replace(/[&<>"']/g, m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[m]));
    }

    function slugify(str){
      return String(str || '')
        .toLowerCase()
        .trim()
        .replace(/<[^>]+>/g, '')
        .replace(/[^\w\u4e00-\u9fa5\- ]+/g, '')
        .replace(/\s+/g, '-')
        .replace(/\-+/g, '-')
        .replace(/^\-|\-$/g, '') || 'section';
    }

    function createPostId(item, index){
      const n = item.number || (index + 1);
      return `post-${n}`;
    }

    function attachHeadingIds(){
      const posts = app.querySelectorAll('.post');

      posts.forEach((post, postIndex) => {
        const postId = post.id || `post-${postIndex + 1}`;
        const headings = post.querySelectorAll('.content h2, .content h3');

        headings.forEach((h, idx) => {
          const text = h.textContent.trim();
          const hid = `${postId}-${slugify(text)}-${idx + 1}`;
          h.id = hid;

          const anchor = document.createElement('a');
          anchor.href = `#${hid}`;
          anchor.className = 'anchor';
          anchor.textContent = '#';
          anchor.setAttribute('aria-label', `定位到 ${text}`);
          h.appendChild(anchor);
        });
      });
    }

    function buildTOC(){
      const posts = app.querySelectorAll('.post');
      const tocItems = [];

      posts.forEach(post => {
        const postId = post.id;
        const postTitleEl = post.querySelector('.title');
        const postTitle = postTitleEl ? postTitleEl.textContent.trim() : '未命名文章';

        tocItems.push(`
          <a class="tocItem level-post" data-target="${postId}" href="#${postId}">
            ${escapeHtml(postTitle)}
          </a>
        `);

        const headings = post.querySelectorAll('.content h2, .content h3');
        headings.forEach(h => {
          const level = h.tagName.toLowerCase();
          const text = h.childNodes[0]
            ? h.childNodes[0].textContent.trim()
            : h.textContent.trim();

          if (!text) return;

          tocItems.push(`
            <a class="tocItem level-${level}" data-target="${h.id}" href="#${h.id}">
              ${escapeHtml(text)}
            </a>
          `);
        });
      });

      if (!tocItems.length){
        toc.innerHTML = `<div class="tocEmpty">当前没有可显示的目录。</div>`;
      } else {
        toc.innerHTML = tocItems.join('');
      }
    }

    function setActiveToc(id){
      const items = toc.querySelectorAll('.tocItem');
      items.forEach(el => el.classList.remove('active'));

      const active = toc.querySelector(`.tocItem[data-target="${id}"]`);
      if (!active) return;

      active.classList.add('active');

      const tocRect = toc.getBoundingClientRect();
      const itemRect = active.getBoundingClientRect();
      const isAbove = itemRect.top < tocRect.top + 24;
      const isBelow = itemRect.bottom > tocRect.bottom - 24;

      if (isAbove || isBelow){
        active.scrollIntoView({
          block: 'center',
          behavior: 'smooth'
        });
      }
    }

    function setupTOCObserver(){
      if (headingObserver) headingObserver.disconnect();

      const targets = [
        ...app.querySelectorAll('.post'),
        ...app.querySelectorAll('.content h2, .content h3')
      ];

      if (!targets.length) return;

      let visible = [];

      headingObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const id = entry.target.id;
          if (!id) return;

          visible = visible.filter(v => v.id !== id);

          if (entry.isIntersecting){
            visible.push({
              id,
              top: entry.boundingClientRect.top
            });
          }
        });

        if (!visible.length) return;
        visible.sort((a, b) => Math.abs(a.top) - Math.abs(b.top));
        setActiveToc(visible[0].id);
      }, {
        root: null,
        rootMargin: '-120px 0px -55% 0px',
        threshold: [0, 1]
      });

      targets.forEach(el => headingObserver.observe(el));
    }

    async function render(list){
      if (!list.length){
        app.className = "status";
        app.innerHTML = '还没有记过东西哦～（去 GitHub Issues 新建一条试试）';
        countHint.textContent = "0 篇";
        toc.innerHTML = '<div class="tocEmpty">当前没有可显示的目录。</div>';
        return;
      }

      app.className = "list";
      app.innerHTML = list.map((item, index) => {
        const title = escapeHtml(item.title);
        const date = fmtDate(item.created_at);
        const body = marked.parse(item.body || '');
        const link = item.html_url;
        const postId = createPostId(item, index);

        return `
          <article class="post" id="${postId}">
            <div class="postHead">
              <h2 class="title">
                <a href="#${postId}">${title}</a>
              </h2>
              <div class="meta">
                <span class="pill">📅 ${date}</span>
                <a class="pill" href="${link}" target="_blank" rel="noreferrer">↗ 在 GitHub 打开</a>
              </div>
            </div>
            <div class="content">${body || '<em style="color:var(--muted)">（无正文）</em>'}</div>
          </article>
        `;
      }).join('');

      countHint.textContent = `${list.length} 篇`;

      attachHeadingIds();

      if (window.MathJax?.typesetPromise){
        MathJax.typesetClear([app]);
        await MathJax.typesetPromise([app]);
      }

      buildTOC();
      setupTOCObserver();

      const first = app.querySelector('.post');
      if (first) setActiveToc(first.id);
    }

    function filterAndRender(){
      const q = (searchInput.value || '').trim().toLowerCase();
      if (!q){
        render(allIssues);
        return;
      }

      const filtered = allIssues.filter(it => {
        const t = (it.title || '').toLowerCase();
        const b = (it.body || '').toLowerCase();
        return t.includes(q) || b.includes(q);
      });

      render(filtered);
    }

    async function loadIssues(){
      app.className = "status";
      app.innerHTML = "正在从 GitHub 拉取 Issues…";
      countHint.textContent = "—";
      toc.innerHTML = '<div class="tocEmpty">正在生成目录…</div>';

      try{
        const url = `https://api.github.com/repos/${user}/${repo}/issues?per_page=100&state=open&sort=created&direction=desc`;
        const res = await fetch(url);
        const data = await res.json();

        if (!Array.isArray(data)) throw new Error('Bad response');

        allIssues = data.filter(x => !x.pull_request);
        await render(allIssues);
      }catch(e){
        app.className = "status";
        app.innerHTML = '<span style="color:#ef4444;">加载失败</span>：请检查网络、仓库名、或是否触发 GitHub API 频率限制（可稍后重试）。';
        toc.innerHTML = '<div class="tocEmpty">目录加载失败。</div>';
      }
    }

    refreshBtn.addEventListener('click', loadIssues);
    searchInput.addEventListener('input', filterAndRender);

    const THEME_KEY = 'qylog_theme';

    function getDefaultTheme(){
      return 'light';
    }

    function applyTheme(theme){
      if (theme === 'dark'){
        document.documentElement.setAttribute('data-theme', 'dark');
      }else{
        document.documentElement.removeAttribute('data-theme');
      }
      updateThemeIcon(theme);
    }

    function updateThemeIcon(theme){
      const isLight = (theme === 'light');
      themeToggle.textContent = isLight ? '🌙' : '☀️';
      themeToggle.title = isLight ? '切换到深色' : '切换到浅色';
    }

    function initTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      const theme = (saved === 'dark' || saved === 'light') ? saved : getDefaultTheme();
      applyTheme(theme);
    }

    themeToggle.addEventListener('click', () => {
      const saved = localStorage.getItem(THEME_KEY);
      const current = (saved === 'dark' || saved === 'light') ? saved : getDefaultTheme();
      const next = (current === 'light') ? 'dark' : 'light';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    initTheme();
    loadIssues();
  </script>
</body>
</html>
