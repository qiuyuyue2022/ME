<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QiuYuyue · Log</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --cardBorder: rgba(15,23,42,.10);
      --text: #0f172a;
      --muted: rgba(15,23,42,.70);
      --muted2: rgba(15,23,42,.55);
      --link: #2563eb;
      --accent: #1d4ed8;
      --accentBg: rgba(29,78,216,.12);
      --codeBg: rgba(148,163,184,.22);
      --preBg: rgba(148,163,184,.16);
      --shadow: 0 10px 25px rgba(2,6,23,.10);
      --radius: 16px;
      --wrapMax: 1380px;

      /* 目录尺寸与位置 - 已改为左侧 */
      --tocWidth: 280px;
      --tocLeft: 24px;
      --tocTop: 112px;
      --mainLeftGap: 320px;
    }

    html[data-theme="dark"]{
      --bg: #0b0f14;
      --card: rgba(255,255,255,.06);
      --cardBorder: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --muted2: rgba(255,255,255,.45);
      --link: #7aa2f7;
      --accent: #5b8cff;
      --accentBg: rgba(91,140,255,.14);
      --codeBg: rgba(255,255,255,.08);
      --preBg: rgba(255,255,255,.07);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    body{
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }

    .wrap{ max-width: var(--wrapMax); margin: 0 auto; padding: 18px 20px 60px; position: relative; }

    .topbar{
      position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); padding: 14px 0 10px;
    }
    html:not([data-theme="dark"]) .topbar{ background: linear-gradient(to bottom, rgba(255,255,255,.82), rgba(255,255,255,0)); }
    html[data-theme="dark"] .topbar{ background: linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0)); }

    .header{ display:flex; align-items:flex-end; justify-content:space-between; gap: 12px; }
    .brand h1{ margin:0; font-size: 22px; font-weight: 780; }
    .brand .sub{ margin:0; color: var(--muted); font-size: 13.5px; }

    .btn{
      border: 1px solid var(--cardBorder); background: var(--card); color: var(--text);
      padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor:pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.08); transition: all .2s;
    }
    .btn:hover{ transform: translateY(-1px); }

    .searchRow{ margin-top: 14px; display:flex; gap: 10px; align-items:center; }
    .search{
      flex:1; border: 1px solid var(--cardBorder); background: var(--card);
      color: var(--text); padding: 12px 14px; border-radius: 14px; outline:none;
    }

    /* 主内容区：左侧留出空间 */
    .mainWrap{ padding-left: var(--mainLeftGap); margin-top: 18px; }

    .post{
      border: 1px solid var(--cardBorder); background: var(--card);
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 24px; overflow:hidden; scroll-margin-top: 108px;
    }
    .postHead{ padding: 18px 20px; border-bottom: 1px solid var(--cardBorder); }
    .title{ margin:0; font-size: 20px; font-weight: 760; }
    .content{ padding: 20px; font-size: 15px; line-height: 1.8; }
    .content img { max-width: 100%; height: auto !important; border-radius: 12px; margin: 12px 0; }
    .content pre{ background: var(--preBg); padding: 16px; border-radius: 14px; overflow:auto; }

    /* ===== 左侧折叠目录 ===== */
    .floatingToc{
      position: fixed;
      left: calc((100vw - var(--wrapMax)) / 2 + var(--tocLeft));
      top: var(--tocTop);
      width: var(--tocWidth);
      max-height: calc(100vh - var(--tocTop) - 40px);
      border: 1px solid var(--cardBorder);
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      z-index: 15;
    }

    @media (max-width: 1420px) { .floatingToc { left: var(--tocLeft); } }

    .tocTitle{ margin: 0 0 12px 8px; font-size: 14px; font-weight: 760; }
    .toc{ flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

    /* 目录分组与折叠逻辑 */
    .toc-group { border-radius: 10px; transition: background 0.2s; }
    .toc-sub { 
      display: none; /* 默认隐藏内层结构 */
      margin-bottom: 4px;
    }
    .toc-group.expanded .toc-sub { 
      display: block; /* 活跃时展开 */
    }

    .tocItem{
      display: block; padding: 8px 12px; border-radius: 8px;
      color: var(--muted); font-size: 13px; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tocItem:hover{ background: rgba(15,23,42,.05); color: var(--text); }
    
    .tocItem.level-post{ font-weight: 600; color: var(--text); }
    .tocItem.level-h2{ padding-left: 24px; font-size: 12.5px; color: var(--muted2); }
    .tocItem.level-h3{ padding-left: 36px; font-size: 12px; color: var(--muted2); }

    /* 激活状态 */
    .tocItem.active { color: var(--accent) !important; font-weight: 700; }
    .toc-group.expanded { background: rgba(15,23,42,0.02); }
    html[data-theme="dark"] .toc-group.expanded { background: rgba(255,255,255,0.03); }

    footer{ margin-top: 40px; color: var(--muted2); font-size: 12px; text-align:center; }

    @media (max-width: 900px){
      .mainWrap{ padding-left: 0; }
      .floatingToc{ position: static; width: auto; margin: 18px 0; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <h1>QiuYuyue · Log</h1>
          <p class="sub">我们一起用2年的时间，看看我们会走向哪里</p>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn">🔄 刷新</button>
          <button class="btn" id="themeToggle">🌙</button>
          <a class="btn" id="githubBtn" href="#" target="_blank">↗ GitHub</a>
        </div>
      </div>
      <div class="searchRow">
        <input class="search" id="searchInput" placeholder="搜索标题或正文..." />
        <div class="hint" id="countHint">—</div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <aside class="floatingToc">
      <h2 class="tocTitle">目录</h2>
      <nav id="toc" class="toc"><div class="tocEmpty">获取中...</div></nav>
    </aside>

    <main class="mainWrap">
      <div id="app">正在加载内容...</div>
      <footer>© <span id="year"></span> · Powered by GitHub Issues</footer>
    </main>
  </div>

  <script>
    const user = 'qiuyuyue2022';
    const repo = 'ME';
    marked.setOptions({ gfm: true, breaks: false });

    const app = document.getElementById('app');
    const toc = document.getElementById('toc');
    const searchInput = document.getElementById('searchInput');
    const countHint = document.getElementById('countHint');
    
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('githubBtn').href = `https://github.com/${user}/${repo}/issues`;

    let allIssues = [];
    let headingObserver = null;

    function fmtDate(iso){ return new Date(iso).toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' }); }
    function escapeHtml(str){ return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function slugify(str){ return String(str || '').toLowerCase().trim().replace(/[^\w\u4e00-\u9fa5\- ]+/g, '').replace(/\s+/g, '-') || 'sec'; }

    function attachHeadingIds(){
      app.querySelectorAll('.post').forEach((post, pIdx) => {
        post.querySelectorAll('.content h2, .content h3').forEach((h, hIdx) => {
          h.id = `${post.id}-${slugify(h.textContent)}-${hIdx}`;
        });
      });
    }

    // 重新构建目录：按文章分组
    function buildTOC(){
      const posts = app.querySelectorAll('.post');
      let html = '';
      posts.forEach(post => {
        const title = post.querySelector('.title').textContent.trim();
        const subHeadings = post.querySelectorAll('.content h2, .content h3');
        
        let subHtml = '';
        subHeadings.forEach(h => {
          const level = h.tagName.toLowerCase();
          subHtml += `<a class="tocItem level-${level}" data-target="${h.id}" href="#${h.id}">${escapeHtml(h.textContent)}</a>`;
        });

        html += `
          <div class="toc-group" id="group-${post.id}">
            <a class="tocItem level-post" data-target="${post.id}" href="#${post.id}">${escapeHtml(title)}</a>
            <div class="toc-sub">${subHtml}</div>
          </div>
        `;
      });
      toc.innerHTML = html || '<div class="tocEmpty">无目录</div>';
    }

    function setActiveToc(id){
      toc.querySelectorAll('.tocItem').forEach(el => el.classList.remove('active'));
      toc.querySelectorAll('.toc-group').forEach(el => el.classList.remove('expanded'));

      const activeLink = toc.querySelector(`.tocItem[data-target="${id}"]`);
      if (activeLink) {
        activeLink.classList.add('active');
        // 找到所属的分组并展开
        const group = activeLink.closest('.toc-group');
        if (group) group.classList.add('expanded');
        activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function setupTOCObserver(){
      if (headingObserver) headingObserver.disconnect();
      const targets = [...app.querySelectorAll('.post'), ...app.querySelectorAll('.content h2, .content h3')];
      headingObserver = new IntersectionObserver((entries) => {
        // 寻找当前最顶部的可见元素
        const visible = entries.find(e => e.isIntersecting);
        if (visible) setActiveToc(visible.target.id);
      }, { rootMargin: '-10% 0px -70% 0px' });
      targets.forEach(el => headingObserver.observe(el));
    }

    async function render(list){
      if (!list.length) { app.innerHTML = "未发现文章"; return; }
      app.innerHTML = list.map((item, index) => {
        const postId = `post-${item.number || index}`;
        return `
          <article class="post" id="${postId}">
            <div class="postHead">
              <h2 class="title"><a href="#${postId}">${escapeHtml(item.title)}</a></h2>
              <div style="font-size:12px; color:var(--muted); margin-top:8px">📅 ${fmtDate(item.created_at)}</div>
            </div>
            <div class="content">${marked.parse(item.body || '')}</div>
          </article>
        `;
      }).join('');

      countHint.textContent = `${list.length} 篇`;
      attachHeadingIds();
      if (window.MathJax?.typesetPromise) await MathJax.typesetPromise([app]);
      buildTOC();
      setupTOCObserver();
    }

    async function loadIssues(){
      app.innerHTML = "获取中...";
      try{
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/issues?state=open&sort=created&per_page=100`);
        allIssues = (await res.json()).filter(x => !x.pull_request);
        render(allIssues);
      } catch(e) { app.innerHTML = "数据加载失败"; }
    }

    // 主题
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.toggleAttribute('data-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    document.getElementById('refreshBtn').addEventListener('click', loadIssues);
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase();
      render(allIssues.filter(it => it.title.toLowerCase().includes(q) || it.body.toLowerCase().includes(q)));
    });

    loadIssues();
  </script>
</body>
</html>
