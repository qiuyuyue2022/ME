<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QiuYuyue · Log</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script','noscript','style','textarea','pre','code']
      }
    };
  </script>

  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --cardBorder: rgba(15,23,42,.10);
      --text: #0f172a;
      --muted: rgba(15,23,42,.70);
      --muted2: rgba(15,23,42,.55);

      --link: #2563eb;
      --accent: #1d4ed8;
      --accentBg: rgba(29,78,216,.12);

      --codeBg: rgba(148,163,184,.22);
      --preBg: rgba(148,163,184,.16);
      --shadow: 0 10px 25px rgba(2,6,23,.10);
      --radius: 16px;

      --wrapMax: 1380px;

      /* 浮动目录尺寸 */
      --tocWidth: 290px;
      --tocRight: 24px;
      --tocTop: 112px;

      /* 恢复：主体右侧预留给目录的空间 */
      --mainRightGap: 330px;
    }

    html[data-theme="dark"]{
      --bg: #0b0f14;
      --card: rgba(255,255,255,.06);
      --cardBorder: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --muted2: rgba(255,255,255,.45);

      --link: #7aa2f7;
      --accent: #5b8cff;
      --accentBg: rgba(91,140,255,.14);

      --codeBg: rgba(255,255,255,.08);
      --preBg: rgba(255,255,255,.07);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    html,body{ height:100%; }

    body{
      margin: 0;
      background: radial-gradient(1200px 800px at 50% -20%, rgba(255,255,255,0.04), transparent 60%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    a{ color: var(--link); text-decoration: none; }
    a:hover{ text-decoration: underline; }

    .wrap{
      max-width: var(--wrapMax);
      margin: 0 auto;
      padding: 18px 20px 60px;
      position: relative; /* 必须为 relative 以支撑内部绝对/固定定位 */
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      padding: 14px 0 10px;
    }
    html:not([data-theme="dark"]) .topbar{
      background: linear-gradient(to bottom, rgba(255,255,255,.82), rgba(255,255,255,0));
    }
    html[data-theme="dark"] .topbar{
      background: linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0));
    }

    .header{ display:flex; align-items:flex-end; justify-content:space-between; gap: 12px; }
    .brand h1{ margin:0; font-size: 22px; font-weight: 780; }
    .brand .sub{ margin:0; color: var(--muted); font-size: 13.5px; }
    .actions{ display:flex; gap:10px; align-items:center; }

    .btn{
      border: 1px solid var(--cardBorder); background: var(--card); color: var(--text);
      padding: 9px 12px; border-radius: 999px; font-size: 13px; cursor:pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,.10); transition: all .12s ease;
    }

    .searchRow{ margin-top: 14px; display:flex; gap: 10px; align-items:center; }
    .search{
      flex:1; border: 1px solid var(--cardBorder); background: var(--card);
      color: var(--text); padding: 12px 14px; border-radius: 14px; outline:none;
      box-shadow: var(--shadow); font-size: 14px;
    }

    /* 恢复：主列右侧留白布局 */
    .mainWrap{
      padding-right: var(--mainRightGap);
      margin-top: 18px;
    }

    .list{ display:flex; flex-direction:column; gap: 16px; }

    .post{
      border: 1px solid var(--cardBorder);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      scroll-margin-top: 108px;
    }

    .postHead{ padding: 18px 18px 12px; border-bottom: 1px solid var(--cardBorder); }
    .title{ margin:0; font-size: 19px; font-weight: 760; line-height: 1.35; color: var(--text); }
    .content{ padding: 14px 18px 18px; font-size: 15px; line-height: 1.8; }
    
    /* 修正图片：确保在容器内自适应 */
    .content img {
      max-width: 100%;
      height: auto !important;
      display: block;
      border-radius: 12px;
      margin: 12px 0;
    }

    .content code{ background: var(--codeBg); padding: .15em .45em; border-radius: 8px; font-size: 0.92em; }
    .content pre{ background: var(--preBg); padding: 14px; border-radius: 14px; overflow:auto; }

    /* ===== 目录：使用 FIXED 定位确保始终可见 ===== */
    .floatingToc{
      position: fixed;
      right: calc((100vw - var(--wrapMax)) / 2 + var(--tocRight));
      top: var(--tocTop);
      width: var(--tocWidth);
      max-height: calc(100vh - var(--tocTop) - 40px);
      border: 1px solid var(--cardBorder);
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      display: flex;
      flex-direction: column;
      z-index: 15;
    }

    /* 当窗口宽度小于 wrapMax 时，修正右侧距离 */
    @media (max-width: 1420px) {
      .floatingToc { right: var(--tocRight); }
    }

    .tocTitle{ margin: 0 0 8px; font-size: 14px; font-weight: 760; color: var(--text); }
    .tocDesc{ margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.55; }
    .toc{ flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }

    .tocItem{ display: block; padding: 7px 10px; border-radius: 10px; color: var(--muted); font-size: 13px; }
    .tocItem:hover{ background: rgba(15,23,42,.05); color: var(--text); }
    .tocItem.active{ background: var(--accentBg); color: var(--accent); font-weight: 700; }
    .tocItem.level-post{ font-weight: 700; color: var(--text); margin-top: 4px; }
    .tocItem.level-h2{ padding-left: 16px; }
    .tocItem.level-h3{ padding-left: 28px; font-size: 12.5px; }

    footer{ margin-top: 28px; color: var(--muted2); font-size: 12.5px; text-align:center; }

    /* 窄屏适配：恢复原有逻辑 */
    @media (max-width: 900px){
      .mainWrap{ padding-right: 0; }
      .floatingToc{
        position: static;
        width: auto;
        max-height: none;
        margin: 18px 0;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <h1>QiuYuyue · Log</h1>
          <p class="sub">我们一起用2年的时间，看看我们会走向哪里</p>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn">🔄 刷新</button>
          <button class="btn" id="themeToggle">🌙</button>
          <a class="btn" id="githubBtn" href="#" target="_blank">↗ GitHub</a>
        </div>
      </div>
      <div class="searchRow">
        <input class="search" id="searchInput" placeholder="搜索标题或正文..." />
        <div class="hint" id="countHint">—</div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <aside class="floatingToc">
      <h2 class="tocTitle">目录</h2>
      <p class="tocDesc">自动提取文章结构</p>
      <nav id="toc" class="toc"><div class="tocEmpty">加载中...</div></nav>
    </aside>

    <main class="mainWrap">
      <div id="app" class="status">正在从 GitHub 获取内容...</div>
      <footer>© <span id="year"></span> · Hosted on GitHub Pages</footer>
    </main>
  </div>

  <script>
    // 基础配置
    const user = 'qiuyuyue2022';
    const repo = 'ME';
    marked.setOptions({ gfm: true, breaks: false });

    const app = document.getElementById('app');
    const toc = document.getElementById('toc');
    const searchInput = document.getElementById('searchInput');
    const countHint = document.getElementById('countHint');
    
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('githubBtn').href = `https://github.com/${user}/${repo}/issues`;

    let allIssues = [];
    let headingObserver = null;

    // 格式化函数：保持原始代码的稳健性，防止 Edge 下解析失败
    function fmtDate(iso){
      const d = new Date(iso);
      return d.toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });
    }

    function escapeHtml(str){
      return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function slugify(str){
      return String(str || '').toLowerCase().trim().replace(/[^\w\u4e00-\u9fa5\- ]+/g, '').replace(/\s+/g, '-') || 'section';
    }

    // ID 生成：恢复你原始的 slugify 逻辑，确保锚点跳转在各浏览器一致
    function attachHeadingIds(){
      const posts = app.querySelectorAll('.post');
      posts.forEach((post, pIdx) => {
        const postId = post.id;
        const headings = post.querySelectorAll('.content h2, .content h3');
        headings.forEach((h, hIdx) => {
          const text = h.textContent.trim();
          h.id = `${postId}-${slugify(text)}-${hIdx}`;
        });
      });
    }

    function buildTOC(){
      const posts = app.querySelectorAll('.post');
      const items = [];
      posts.forEach(post => {
        const title = post.querySelector('.title').textContent.trim();
        items.push(`<a class="tocItem level-post" data-target="${post.id}" href="#${post.id}">${escapeHtml(title)}</a>`);
        post.querySelectorAll('.content h2, .content h3').forEach(h => {
          const level = h.tagName.toLowerCase();
          items.push(`<a class="tocItem level-${level}" data-target="${h.id}" href="#${h.id}">${escapeHtml(h.textContent)}</a>`);
        });
      });
      toc.innerHTML = items.length ? items.join('') : '<div class="tocEmpty">无目录</div>';
    }

    function setActiveToc(id){
      const items = toc.querySelectorAll('.tocItem');
      items.forEach(el => el.classList.remove('active'));
      const active = toc.querySelector(`.tocItem[data-target="${id}"]`);
      if (active) {
        active.classList.add('active');
        active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function setupTOCObserver(){
      if (headingObserver) headingObserver.disconnect();
      const targets = [...app.querySelectorAll('.post'), ...app.querySelectorAll('.content h2, .content h3')];
      headingObserver = new IntersectionObserver((entries) => {
        const visible = entries.find(e => e.isIntersecting);
        if (visible) setActiveToc(visible.target.id);
      }, { rootMargin: '-10% 0px -70% 0px' });
      targets.forEach(el => headingObserver.observe(el));
    }

    async function render(list){
      if (!list.length) { app.innerHTML = "未找到内容"; return; }
      app.className = "list";
      app.innerHTML = list.map((item, index) => {
        const postId = `post-${item.number || index}`;
        return `
          <article class="post" id="${postId}">
            <div class="postHead">
              <h2 class="title"><a href="#${postId}">${escapeHtml(item.title)}</a></h2>
              <div class="meta"><span class="pill">📅 ${fmtDate(item.created_at)}</span></div>
            </div>
            <div class="content">${marked.parse(item.body || '')}</div>
          </article>
        `;
      }).join('');

      countHint.textContent = `${list.length} 篇`;
      attachHeadingIds();
      if (window.MathJax?.typesetPromise) await MathJax.typesetPromise([app]);
      buildTOC();
      setupTOCObserver();
    }

    async function loadIssues(){
      app.innerHTML = "正在加载...";
      try{
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/issues?state=open&sort=created&per_page=100`);
        const data = await res.json();
        allIssues = data.filter(x => !x.pull_request);
        render(allIssues);
      } catch(e) { app.innerHTML = "加载失败，请检查网络"; }
    }

    // 主题
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.toggleAttribute('data-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    document.getElementById('refreshBtn').addEventListener('click', loadIssues);
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase();
      render(allIssues.filter(it => it.title.toLowerCase().includes(q) || it.body.toLowerCase().includes(q)));
    });

    loadIssues();
  </script>
</body>
</html>
