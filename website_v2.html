<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QiuYuyue · Log</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script','noscript','style','textarea','pre','code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --cardBorder: rgba(15,23,42,.10);
      --text: #0f172a;
      --muted: rgba(15,23,42,.70);
      --muted2: rgba(15,23,42,.55);
      --link: #2563eb;
      --accent: #1d4ed8;
      --accentBg: rgba(29,78,216,.12);
      --codeBg: rgba(148,163,184,.22);
      --preBg: rgba(148,163,184,.16);
      --shadow: 0 10px 25px rgba(2,6,23,.10);
      --radius: 16px;
      --maxw: 1380px; /* 拓宽容器以容纳目录 */

      /* 目录配置 */
      --tocWidth: 280px;
      --mainLeftGap: 320px; 
    }


    *{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; }
    body{
      margin: 0;
      background: radial-gradient(1200px 800px at 50% -20%, rgba(255,255,255,0.04), transparent 60%), var(--bg);
      color: var(--text);
    }

    a{ color: var(--link); text-decoration: none; }
    a:hover{ text-decoration: underline; }

    /* 布局容器 */
    .wrap{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 18px 20px 60px;
      position: relative;
    }

    /* 顶部栏 */
    .topbar{
      position: relative;
      z-index: 1;
      padding: 14px 0 10px;
    }
    
    .topbar .wrap{
      padding-bottom: 18px;
    }

    html:not([data-theme="dark"]) .topbar{ background: linear-gradient(to bottom, rgba(255,255,255,.75), rgba(255,255,255,0)); }
    html[data-theme="dark"] .topbar{ background: linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0)); }

    .header{ display:flex; align-items:flex-end; justify-content:space-between; gap: 12px; }
    .brand h1{ margin:0; font-size: 22px; font-weight: 780; letter-spacing: .3px; }
    .brand .sub{ margin:0; color: var(--muted); font-size: 13.5px; }
    .actions{ display:flex; gap:10px; align-items:center; }

    .btn{
      border: 1px solid var(--cardBorder); background: var(--card); color: var(--text);
      padding: 9px 12px; border-radius: 999px; font-size: 13px; cursor:pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,.10); transition: all .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 22px rgba(0,0,0,.14); }

    .searchRow{ margin-top: 14px; display:flex; gap: 10px; align-items:center; }
    .search{
      flex:1; border: 1px solid var(--cardBorder); background: var(--card);
      color: var(--text); padding: 12px 14px; border-radius: 14px; outline:none;
      box-shadow: var(--shadow); font-size: 14px;
    }
    .hint{ color: var(--muted2); font-size: 12.5px; white-space: nowrap; }

    /* 主内容区布局 */
    .mainWrap{ padding-left: var(--mainLeftGap); margin-top: 10px; }
    .list{ display:flex; flex-direction:column; gap: 14px; }

    .post{
      border: 1px solid var(--cardBorder); background: var(--card);
      border-radius: var(--radius); box-shadow: var(--shadow);
      overflow:hidden; scroll-margin-top: 120px;
    }
    .postHead{ padding: 18px 18px 12px; border-bottom: 1px solid var(--cardBorder); }
    .title{ margin:0; font-size: 19px; font-weight: 760; color: var(--text); }
    
    .meta{ margin-top: 8px; color: var(--muted); font-size: 12.5px; display:flex; gap: 10px; align-items:center; }
    .pill{
      display:inline-flex; align-items:center; gap: 6px; padding: 4px 10px;
      border-radius: 999px; border: 1px solid var(--cardBorder);
      background: rgba(15,23,42,.03); color: var(--muted); font-size: 12px;
    }
    html[data-theme="dark"] .pill{ background: rgba(255,255,255,.04); }

    .content{ padding: 14px 18px 18px; font-size: 15px; line-height: 1.7; }
    .content blockquote{
      margin: 12px 0; padding: 10px 12px; border-left: 4px solid var(--accent);
      background: var(--accentBg); border-radius: 12px;
    }
    .content pre{ background: var(--preBg); padding: 14px; border-radius: 14px; overflow:auto; border: 1px solid var(--cardBorder); }
    .content code{ background: var(--codeBg); padding: .15em .45em; border-radius: 8px; font-size: 0.92em; }
   .content img{
      max-width: 70%;
      height: auto;
      display: block;
      margin: 16px auto;
      border-radius: 12px;
      border: 1px solid var(--cardBorder);
    }
    
    /* 左侧目录样式 */
    .floatingToc{
      position: fixed; width: var(--tocWidth); top: 180px;
      left: calc((100vw - var(--maxw)) / 2 + 20px);
      max-height: calc(100vh - 220px);
      border: 1px solid var(--cardBorder); background: var(--card);
      border-radius: 20px; box-shadow: var(--shadow); padding: 16px;
      display: flex; flex-direction: column; z-index: 10;
    }
    .tocTitle{ margin: 0 0 10px; font-size: 14px; font-weight: 800; color: var(--text); opacity: 0.8; }
    .toc{ flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    
    .toc-group { border-radius: 10px; }
    .toc-sub { display: none; margin-bottom: 4px; }
    .toc-group.expanded .toc-sub { display: block; }

    .tocItem{
      display: block; padding: 7px 10px; border-radius: 8px;
      color: var(--muted); font-size: 13px; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: all 0.2s;
    }
    .tocItem:hover{ background: var(--accentBg); color: var(--accent); }
    .tocItem.active { color: var(--accent); font-weight: 700; background: var(--accentBg); }
    .tocItem.level-post{ font-weight: 700; color: var(--text); margin-top: 4px; }
    .tocItem.level-h2{ padding-left: 20px; font-size: 12.5px; }
    .tocItem.level-h3{ padding-left: 32px; font-size: 12px; }

    .status{ margin: 22px 0; border: 1px dashed var(--cardBorder); background: rgba(15,23,42,.03); border-radius: 14px; padding: 30px; text-align:center; color: var(--muted); }
    footer{ margin-top: 28px; color: var(--muted2); font-size: 12.5px; text-align:center; }

    @media (max-width: 1000px){
      .mainWrap{ padding-left: 0; }
      .floatingToc{ display: none; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <h1>QiuYuyue · Log</h1>
          <p class="sub">我们一起用2年的时间，看看我们会走向哪里</p>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn">🔄 刷新</button>
          <a class="btn" id="githubBtn" href="#" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </div>
      <div class="searchRow">
        <input class="search" id="searchInput" placeholder="搜索标题或正文（本地过滤）" />
        <div class="hint" id="countHint">—</div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <aside class="floatingToc">
      <h2 class="tocTitle">CONTENTS</h2>
      <nav id="toc" class="toc"><div style="font-size:12px;color:var(--muted2)">等待加载...</div></nav>
    </aside>

    <main class="mainWrap">
      <div id="app" class="status">正在同步数据...</div>
      <footer>© <span id="year"></span> · Hosted on GitHub Pages</footer>
    </main>
  </div>

  <script>
    const user = 'qiuyuyue2022';
    const repo = 'ME';
    marked.setOptions({ gfm: true, breaks: false });

    const app = document.getElementById('app');
    const toc = document.getElementById('toc');
    const searchInput = document.getElementById('searchInput');
    const countHint = document.getElementById('countHint');
    let allIssues = [];
    let headingObserver = null;

    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('githubBtn').href = `https://github.com/${user}/${repo}/issues`;

    function fmtDate(iso){ return new Date(iso).toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' }); }
    function escapeHtml(str){ return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function slugify(str){ return String(str || '').toLowerCase().trim().replace(/[^\w\u4e00-\u9fa5\- ]+/g, '').replace(/\s+/g, '-') || 'sec'; }

    // 目录逻辑
    function attachHeadingIds(){
      app.querySelectorAll('.post').forEach((post) => {
        post.querySelectorAll('.content h2, .content h3').forEach((h, hIdx) => {
          h.id = `${post.id}-${slugify(h.textContent)}-${hIdx}`;
        });
      });
    }

    function buildTOC(){
      const posts = app.querySelectorAll('.post');
      let html = '';
      posts.forEach(post => {
        const title = post.querySelector('.title').textContent.trim();
        const subHeadings = post.querySelectorAll('.content h2, .content h3');
        let subHtml = '';
        subHeadings.forEach(h => {
          const level = h.tagName.toLowerCase();
          subHtml += `<a class="tocItem level-${level}" data-target="${h.id}" href="#${h.id}">${escapeHtml(h.textContent)}</a>`;
        });
        html += `
          <div class="toc-group" id="group-${post.id}">
            <a class="tocItem level-post" data-target="${post.id}" href="#${post.id}">${escapeHtml(title)}</a>
            <div class="toc-sub">${subHtml}</div>
          </div>
        `;
      });
      toc.innerHTML = html || '<div style="padding:10px; font-size:12px; color:var(--muted2)">暂无目录</div>';
    }

    function setActiveToc(id){
      toc.querySelectorAll('.tocItem').forEach(el => el.classList.remove('active'));
      const activeLink = toc.querySelector(`.tocItem[data-target="${id}"]`);
      if (activeLink) {
        activeLink.classList.add('active');
        toc.querySelectorAll('.toc-group').forEach(g => g.classList.remove('expanded'));
        const group = activeLink.closest('.toc-group');
        if (group) group.classList.add('expanded');
      }
    }

    function setupTOCObserver(){
      if (headingObserver) headingObserver.disconnect();
      const targets = [...app.querySelectorAll('.post'), ...app.querySelectorAll('.content h2, .content h3')];
      headingObserver = new IntersectionObserver((entries) => {
        const visible = entries.find(e => e.isIntersecting);
        if (visible) setActiveToc(visible.target.id);
      }, { rootMargin: '-10% 0px -75% 0px' });
      targets.forEach(el => headingObserver.observe(el));
    }

    // 渲染逻辑
    async function render(list){
      if (!list.length){
        app.className = "status";
        app.innerHTML = '还没有内容哦～';
        countHint.textContent = "0 篇";
        toc.innerHTML = '';
        return;
      }

      app.className = "list";
      app.innerHTML = list.map((item, index) => {
        const postId = `post-${item.number || index}`;
        const title = escapeHtml(item.title);
        const date = fmtDate(item.created_at);
        const body = marked.parse(item.body || '');
        return `
          <article class="post" id="${postId}">
            <div class="postHead">
              <h2 class="title"><a href="#${postId}">${title}</a></h2>
              <div class="meta">
                <span class="pill">📅 ${date}</span>
                <a class="pill" href="${item.html_url}" target="_blank">↗ GitHub</a>
              </div>
            </div>
            <div class="content">${body || '<em>（无正文）</em>'}</div>
          </article>
        `;
      }).join('');

      countHint.textContent = `${list.length} 篇`;
      attachHeadingIds();
      if (window.MathJax?.typesetPromise) {
        MathJax.typesetClear([app]);
        await MathJax.typesetPromise([app]);
      }
      buildTOC();
      setupTOCObserver();
    }

    async function loadIssues(){
      app.className = "status";
      app.innerHTML = "正在拉取 GitHub Issues...";
      countHint.textContent = "—";
    
      try{
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/issues?state=open&sort=created&direction=desc&per_page=100`, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-store',
          headers: {
            'Accept': 'application/vnd.github+json'
          }
        });
        const data = await res.json();
    
        if (!Array.isArray(data)) {
          throw new Error('Bad response');
        }
    
        allIssues = data.filter(x => !x.pull_request);
        await render(allIssues);
      } catch(e) {
        app.className = "status";
        app.innerHTML = "加载失败，请检查网络、仓库名，或是否触发 GitHub API 频率限制。";
        toc.innerHTML = '<div style="font-size:12px;color:var(--muted2)">目录不可用</div>';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => loadIssues(true));
    
    searchInput.addEventListener('input', async () => {
      const q = (searchInput.value || '').toLowerCase();
    
      const filtered = allIssues.filter(it => {
        const title = (it.title || '').toLowerCase();
        const body = (it.body || '').toLowerCase();
        return title.includes(q) || body.includes(q);
      });
    
      await render(filtered);
    });
    
    let hasInitialized = false;
    
    function initLoad(){
      if (hasInitialized) return;
      hasInitialized = true;
      loadIssues();
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLoad, { once: true });
    } else {
      initLoad();
    }
    
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        loadIssues(true);
      }
    });
  </script>
</body>
</html>
