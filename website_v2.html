<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QiuYuyue · Log</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root{
      /* 核心色彩 */
      --bg: #f8fafc;
      --card: #ffffff;
      --cardBorder: rgba(15, 23, 42, 0.08);
      --text: #1e293b;
      --muted: #64748b;
      --muted2: #94a3b8;
      --link: #2563eb;
      --accent: #1d4ed8;
      --accentBg: rgba(37, 99, 235, 0.08);
      --codeBg: rgba(241, 245, 249, 1);
      --preBg: #f1f5f9;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --wrapMax: 1380px;

      /* 字体栈：优先 Mac 优雅字体 */
      --font-main: "Inter", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      
      /* 布局 */
      --tocWidth: 280px;
      --tocStickyTop: 120px;
    }

    html[data-theme="dark"]{
      --bg: #0f172a;
      --card: #1e293b;
      --cardBorder: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted2: #64748b;
      --link: #60a5fa;
      --accent: #3b82f6;
      --accentBg: rgba(59, 130, 246, 0.12);
      --codeBg: rgba(30, 41, 59, 0.8);
      --preBg: #0f172a;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
    }

    *{ box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html{ scroll-behavior: smooth; }
    body{
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-main);
      line-height: 1.75;
    }

    /* ===== 顶部导航：恢复透明毛玻璃 ===== */
    .topbar{
      position: sticky; top: 0; z-index: 100; 
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 16px 0;
      border-bottom: 1px solid var(--cardBorder);
    }
    html:not([data-theme="dark"]) .topbar{ background: rgba(248, 250, 252, 0.75); }
    html[data-theme="dark"] .topbar{ background: rgba(15, 23, 42, 0.75); }

    .wrap{ max-width: var(--wrapMax); margin: 0 auto; padding: 0 30px; }

    .header{ display:flex; align-items:center; justify-content:space-between; gap: 12px; }
    .brand h1{ margin:0; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .brand .sub{ margin:2px 0 0; color: var(--muted); font-size: 13px; font-weight: 400; }

    .btn{
      border: 1px solid var(--cardBorder); background: var(--card); color: var(--text);
      padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor:pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
    }
    .btn:hover{ background: var(--bg); transform: translateY(-1px); }

    .searchRow{ margin-top: 16px; display:flex; gap: 12px; align-items:center; }
    .search{
      flex:1; border: 1px solid var(--cardBorder); 
      background: rgba(255, 255, 255, 0.4); 
      color: var(--text); padding: 10px 16px; border-radius: 10px; outline:none; font-size: 14px;
      transition: all 0.2s;
      font-family: var(--font-main);
    }
    html[data-theme="dark"] .search { background: rgba(30, 41, 59, 0.4); }
    .search:focus{ background: var(--card); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accentBg); }

    /* 布局结构 */
    .content-area {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      margin-top: 32px;
      padding-bottom: 80px;
    }

    /* 左侧目录 */
    .floatingToc{
      position: sticky;
      top: var(--tocStickyTop);
      width: var(--tocWidth);
      flex-shrink: 0;
      max-height: calc(100vh - 160px);
      background: transparent;
      padding: 0 10px 0 0;
      overflow-y: auto;
      z-index: 10;
    }

    .tocTitle{ 
      margin: 0 0 16px 12px; font-size: 11px; font-weight: 700; 
      color: var(--muted2); text-transform: uppercase; letter-spacing: 1.5px; 
    }
    .toc{ display: flex; flex-direction: column; gap: 2px; }

    /* 目录折叠逻辑 */
    .toc-group { border-radius: 8px; margin-bottom: 2px; }
    .toc-sub { display: none; margin: 2px 0 6px; }
    .toc-group.expanded .toc-sub { display: block; }

    .tocItem{
      display: block; padding: 6px 12px; border-radius: 6px;
      color: var(--muted); font-size: 13px; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: all 0.15s;
    }
    .tocItem:hover{ color: var(--accent); background: var(--accentBg); }
    .tocItem.active { color: var(--accent) !important; font-weight: 600; background: var(--accentBg); }
    .tocItem.level-post{ font-weight: 500; color: var(--text); }
    .tocItem.level-h2{ padding-left: 24px; font-size: 12.5px; opacity: 0.8; }
    .tocItem.level-h3{ padding-left: 36px; font-size: 12px; opacity: 0.7; }

    /* 右侧正文 */
    .mainWrap{ flex: 1; min-width: 0; }

    .post{
      border: 1px solid var(--cardBorder); background: var(--card);
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 40px; overflow:hidden; scroll-margin-top: 130px;
    }
    .postHead{ padding: 28px 30px 20px; border-bottom: 1px solid var(--cardBorder); }
    .title{ 
      margin:0; font-size: 24px; font-weight: 700; line-height: 1.3; 
      letter-spacing: -0.5px; color: var(--text);
    }
    .title a { color: inherit; text-decoration: none; }
    
    .content{ padding: 30px; font-size: 16px; color: var(--text); }
    .content h2{ font-size: 20px; font-weight: 700; margin: 1.8em 0 1em; scroll-margin-top: 130px; border-bottom: 1px solid var(--cardBorder); padding-bottom: 0.3em;}
    .content h3{ font-size: 17px; font-weight: 700; margin: 1.5em 0 0.8em; scroll-margin-top: 130px; }
    
    .content img { 
      max-width: 100% !important; height: auto !important; 
      border-radius: 8px; margin: 24px 0; display: block;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
    }
    
    .content pre{ 
      background: var(--preBg); padding: 20px; border-radius: 10px; 
      overflow:auto; border: 1px solid var(--cardBorder); margin: 1.5em 0;
    }
    .content code{ 
      background: var(--codeBg); padding: 0.2em 0.4em; 
      border-radius: 4px; font-size: 0.9em; font-family: "SF Mono", Menlo, monospace;
    }

    footer{ margin-top: 60px; color: var(--muted2); font-size: 12px; text-align:center; padding-bottom: 60px; }

    @media (max-width: 900px){
      .content-area { flex-direction: column; }
      .floatingToc { position: relative; top: 0; width: 100%; max-height: 250px; margin-bottom: 30px; }
      .mainWrap { width: 100%; }
    }
  </style>
</head>

<body>
  <nav class="topbar">
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <h1>QiuYuyue · Log</h1>
          <p class="sub">我们一起用2年的时间，看看我们会走向哪里</p>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn">刷新数据</button>
          <button class="btn" id="themeToggle">🌙</button>
          <a class="btn" id="githubBtn" href="#" target="_blank">GitHub</a>
        </div>
      </div>
      <div class="searchRow">
        <input class="search" id="searchInput" placeholder="搜索关键词..." />
        <div style="font-size:12px; color:var(--muted); min-width:40px; text-align:right" id="countHint">—</div>
      </div>
    </div>
  </nav>

  <div class="wrap content-area">
    <aside class="floatingToc">
      <h2 class="tocTitle">Index</h2>
      <nav id="toc" class="toc"><div style="padding:12px; color:var(--muted2); font-size:12px">Loading index...</div></nav>
    </aside>

    <main class="mainWrap">
      <div id="app">正在同步内容...</div>
      <footer>© <span id="year"></span> · Designed for Research & Clarity</footer>
    </main>
  </div>

  <script>
    const user = 'qiuyuyue2022';
    const repo = 'ME';
    marked.setOptions({ gfm: true, breaks: false });

    const app = document.getElementById('app');
    const toc = document.getElementById('toc');
    const searchInput = document.getElementById('searchInput');
    const countHint = document.getElementById('countHint');
    
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('githubBtn').href = `https://github.com/${user}/${repo}/issues`;

    let allIssues = [];
    let headingObserver = null;

    function fmtDate(iso){ return new Date(iso).toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' }); }
    function escapeHtml(str){ return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function slugify(str){ return String(str || '').toLowerCase().trim().replace(/[^\w\u4e00-\u9fa5\- ]+/g, '').replace(/\s+/g, '-') || 'sec'; }

    function attachHeadingIds(){
      app.querySelectorAll('.post').forEach((post) => {
        post.querySelectorAll('.content h2, .content h3').forEach((h, hIdx) => {
          h.id = `${post.id}-${slugify(h.textContent)}-${hIdx}`;
        });
      });
    }

    function buildTOC(){
      const posts = app.querySelectorAll('.post');
      let html = '';
      posts.forEach(post => {
        const title = post.querySelector('.title').textContent.trim();
        const subHeadings = post.querySelectorAll('.content h2, .content h3');
        let subHtml = '';
        subHeadings.forEach(h => {
          const level = h.tagName.toLowerCase();
          subHtml += `<a class="tocItem level-${level}" data-target="${h.id}" href="#${h.id}">${escapeHtml(h.textContent)}</a>`;
        });
        html += `
          <div class="toc-group" id="group-${post.id}">
            <a class="tocItem level-post" data-target="${post.id}" href="#${post.id}">${escapeHtml(title)}</a>
            <div class="toc-sub">${subHtml}</div>
          </div>
        `;
      });
      toc.innerHTML = html || '<div style="padding:12px">No Index</div>';
    }

    function setActiveToc(id){
      toc.querySelectorAll('.tocItem').forEach(el => el.classList.remove('active'));
      const activeLink = toc.querySelector(`.tocItem[data-target="${id}"]`);
      if (activeLink) {
        activeLink.classList.add('active');
        toc.querySelectorAll('.toc-group').forEach(g => g.classList.remove('expanded'));
        const group = activeLink.closest('.toc-group');
        if (group) group.classList.add('expanded');
      }
    }

    function setupTOCObserver(){
      if (headingObserver) headingObserver.disconnect();
      const targets = [...app.querySelectorAll('.post'), ...app.querySelectorAll('.content h2, .content h3')];
      headingObserver = new IntersectionObserver((entries) => {
        const visible = entries.find(e => e.isIntersecting);
        if (visible) setActiveToc(visible.target.id);
      }, { rootMargin: '-140px 0px -70% 0px' });
      targets.forEach(el => headingObserver.observe(el));
    }

    async function render(list){
      if (!list || !list.length) { app.innerHTML = '<div style="padding:60px; text-align:center; color:var(--muted)">未找到相关记录</div>'; return; }
      app.innerHTML = list.map((item, index) => {
        const postId = `post-${item.number || index}`;
        return `
          <article class="post" id="${postId}">
            <div class="postHead">
              <h2 class="title"><a href="#${postId}">${escapeHtml(item.title)}</a></h2>
              <div style="font-size:12px; color:var(--muted2); margin-top:8px; font-weight:500">
                ${fmtDate(item.updated_at || item.created_at)}
              </div>
            </div>
            <div class="content">${marked.parse(item.body || '')}</div>
          </article>
        `;
      }).join('');

      countHint.textContent = `${list.length} 篇`;
      attachHeadingIds();
      if (window.MathJax?.typesetPromise) await MathJax.typesetPromise([app]);
      buildTOC();
      setTimeout(setupTOCObserver, 100);
    }

    async function loadIssues(){
      app.innerHTML = '<div style="padding:60px; text-align:center; color:var(--muted)">读取数据中...</div>';
      try{
        const url = `https://api.github.com/repos/${user}/${repo}/issues?state=open&sort=created&per_page=100`;
        const res = await fetch(url);
        if(!res.ok) throw new Error();
        const data = await res.json();
        allIssues = data.filter(x => !x.pull_request);
        render(allIssues);
      } catch(e) { app.innerHTML = '<div style="padding:60px; text-align:center; color:red">数据连接失败</div>'; }
    }

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.toggleAttribute('data-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggle.textContent = '☀️';
    }

    document.getElementById('refreshBtn').addEventListener('click', loadIssues);
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase();
      const filtered = allIssues.filter(it => it.title.toLowerCase().includes(q) || (it.body && it.body.toLowerCase().includes(q)));
      render(filtered);
    });

    window.onload = loadIssues;
  </script>
</body>
</html>
